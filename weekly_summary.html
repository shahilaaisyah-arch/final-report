<head>

<title>Industrial Training Report - Weekly Summary</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Times New Roman", Times, serif;
background:#f4f4f4;
color:black;
}

/* HEADER */

.header{
background:#D1B399;
color:black;
text-align:center;
padding:15px;
font-size:24px;
font-weight:bold;
letter-spacing:1px;
}

/* NAVIGATION */

nav{
background:#D1B399;
padding:15px;
text-align:center;
position:relative;
}

.nav-links{
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.nav-links a{
color:white;
text-decoration:none;
font-weight:bold;
position:relative;
font-size:15px;
}

.nav-links a::after{
content:"";
width:0%;
height:2px;
background:white;
position:absolute;
left:0;
bottom:-4px;
transition:0.3s;
}

.nav-links a:hover::after{
width:100%;
}

.menu-toggle{
display:none;
font-size:24px;
color:white;
font-weight:bold;
cursor:pointer;
text-align:left;
}

/* ANIMATION */

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

/* CONTAINER */

.container{
max-width:900px;
margin:40px auto;
padding:30px;
background:#E3DFD2;
border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.page-title{
font-size:26px;
text-align:center;
margin-bottom:25px;
font-weight:bold;
}

/* WEEK BUTTONS */

.week-buttons{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:10px;
margin-bottom:25px;
}

.week-btn{
padding:12px;
background:#B0B7AB;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
font-family:"Times New Roman";
}

.week-btn:hover{
background:#9EA596;
transform:translateY(-2px);
}

/* WEEK CONTENT */

.week-content{
display:none;
background:white;
padding:25px;
margin-top:10px;
border-radius:6px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
text-align:justify;
animation:fadeIn 0.3s ease;
}

.week-content h2{
margin-bottom:20px;
text-align:center;
font-size:24px;
}

.week-content p{
font-size:15px;
line-height:1.7;
margin-bottom:15px;
}

/* IMAGE ROW */
.image-row{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin-top:20px;
margin-bottom:20px;
flex-wrap:nowrap;
overflow-x:auto;
}

.image-row img{
width:250px;
min-width:250px;
height:170px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
transition:0.3s;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
display:block;
}

.image-row img:hover{
transform:scale(1.03);
}
  
/* POPUP */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.popup img{
max-width:85%;
max-height:85%;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.popup span{
position:absolute;
top:20px;
right:30px;
font-size:35px;
color:white;
cursor:pointer;
font-weight:bold;
}

/* FOOTER */

footer{
background:#D1B399;
color:black;
text-align:center;
padding:12px;
margin-top:40px;
}

/* MOBILE RESPONSIVE */

@media (max-width:768px){

.header{
font-size:18px;
padding:12px;
}

.header span{
font-size:12px !important;
}

.menu-toggle{
display:block;
padding-left:10px;
text-align:left;
}

.nav-links{
display:none;
flex-direction:column;
background:#D1B399;
margin-top:15px;
padding:10px 0;
border-radius:8px;
animation:fadeIn 0.3s ease;
}

.nav-links.active{
display:flex;
}

.nav-links a{
padding:10px;
font-size:16px;
}

.container{
width:92%;
margin:25px auto;
padding:20px;
}

.page-title{
font-size:22px;
}

.week-buttons{
grid-template-columns:repeat(2,1fr);

.week-btn{
font-size:14px;

.week-content{
padding:18px;

.week-content h2{

.week-content p{

.image-row{
flex-direction:column;
}

.image-row img{
height:auto;
}

.popup img{
max-width:95%;
max-height:80%;
}

}

</style>
</head>
